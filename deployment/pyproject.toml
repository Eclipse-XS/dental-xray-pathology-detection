[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dentex-deployment"
version = "0.1.0"
description = "Deployment subsystem for the selected DENTEX FCOS detector"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
onnx = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
storage = ["minio>=7.2,<8"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]
airflow = ["apache-airflow>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/dental_xray_service"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["orchestration/airflow/dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
