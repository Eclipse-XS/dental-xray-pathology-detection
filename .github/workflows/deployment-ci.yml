name: deployment-ci
on:
  push:
    paths: ["deployment/**", ".github/workflows/deployment-ci.yml"]
  pull_request:
    paths: ["deployment/**", ".github/workflows/deployment-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: docker build -t dentex-api:test .
